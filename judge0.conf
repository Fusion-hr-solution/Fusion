# Judge0 configuration — keys must match what Judge0 reads (REDIS_HOST/POSTGRES_*),
# not REDIS_URL/DATABASE_URL. Redis/Resque ignores REDIS_URL and otherwise
# defaults to localhost:6379, which is not reachable from inside the container.

# ─── Redis (job queue) ───────────────────────────────────────────────────────
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0redis

# ─── Postgres (submissions store) ─────────────────────────────────────────────
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0

# ─── Workers / queue (Phase 1 capacity) ───────────────────────────────────────
# Parallel jobs per worker container. Raise with available CPU; for more capacity
# scale the worker horizontally: `docker compose up -d --scale judge0-worker=N`
# (the worker's container_name is intentionally unset so this works).
COUNT=4
# Reject submissions once this many are queued, instead of unbounded queue growth.
MAX_QUEUE_SIZE=1000

# ─── Sandbox limits (server-enforced maximums) ────────────────────────────────
# The interview API also sets per-run limits on each candidate submission; these
# are the hard ceilings Judge0 enforces regardless of what a request asks for.
# Disable network for executed code and forbid any submission from re-enabling it,
# so candidate code can't open sockets (SSRF into the cluster).
ENABLE_NETWORK=false
ALLOW_ENABLE_NETWORK=false
MAX_CPU_TIME_LIMIT=10
MAX_WALL_TIME_LIMIT=20
MAX_MEMORY_LIMIT=512000
MAX_PROCESSES_AND_OR_THREADS=120
