# Judge0 configuration — keys must match what Judge0 reads (REDIS_HOST/POSTGRES_*),
# not REDIS_URL/DATABASE_URL. Redis/Resque ignores REDIS_URL and otherwise
# defaults to localhost:6379, which is not reachable from inside the container.

# ─── Redis (job queue) ───────────────────────────────────────────────────────
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0redis

# ─── Postgres (submissions store) ─────────────────────────────────────────────
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0
